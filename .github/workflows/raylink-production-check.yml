name: RayLink production checks

on:
  pull_request:
    paths:
      - "roms/**"
      - ".github/workflows/raylink-*.yml"
  push:
    branches: [main]
    paths:
      - "roms/**"
      - ".github/workflows/raylink-*.yml"

permissions:
  contents: read

concurrency:
  group: raylink-production-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: roms

jobs:
  runtime:
    name: Build approved protocol Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify metered sing-box Runtime
        run: |
          sudo bash deploy/build-runtime-artifact.sh \
            1.13.14 \
            web/node/runtime \
            amd64
          (
            cd web/node/runtime
            sha256sum -c raylink-sing-box-1.13.14-linux-amd64.sha256
          )
      - uses: actions/upload-artifact@v5
        with:
          name: raylink-protocol-runtime-amd64
          path: |
            roms/web/node/runtime/raylink-sing-box-1.13.14-linux-amd64
            roms/web/node/runtime/raylink-sing-box-1.13.14-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 1

  production-check:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: raylink-protocol-runtime-amd64
          path: roms/web/node/runtime
      - name: Verify downloaded protocol Runtime
        run: |
          chmod 0755 web/node/runtime/raylink-sing-box-1.13.14-linux-amd64
          (
            cd web/node/runtime
            sha256sum -c raylink-sing-box-1.13.14-linux-amd64.sha256
          )
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax, API, protocol and memory checks
        env:
          SING_BOX_BIN: ${{ github.workspace }}/roms/web/node/runtime/raylink-sing-box-1.13.14-linux-amd64
        run: npm run check:production
