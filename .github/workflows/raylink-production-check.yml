name: RayLink production checks

on:
  pull_request:
    paths:
      - "roms/**"
      - ".github/workflows/raylink-*.yml"
  push:
    branches: [main]
    paths:
      - "roms/**"
      - ".github/workflows/raylink-*.yml"

permissions:
  contents: read

concurrency:
  group: raylink-production-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: roms

jobs:
  production-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax, API, protocol and memory checks
        run: npm run check:production
